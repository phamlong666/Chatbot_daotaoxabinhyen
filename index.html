<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot_Chính sách xã hội</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blue-primary: #0284c7;     
            --blue-dark: #0369a1;        
            --blue-deep: #0c4a6e;        
            --blue-light: #f0f9ff;       
            --blue-border: #bae6fd;      
            --text-main: #0f172a;        
            --green-correct: #16a34a;    
            --red-incorrect: #dc2626;    
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Canvas hiệu ứng tuyết rơi */
        #snowflake-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Bố cục tổng thể chia 2 cột: Sidebar trái + Chatbot phải */
        .main-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1260px;
            position: relative;
            z-index: 1000;
        }

        /* Sidebar bên trái chứa các đường link nhanh */
        .sidebar-links {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 24px 20px;
            border: 1px solid rgba(186, 230, 253, 0.6);
            flex-shrink: 0;
            height: fit-content;
        }

        .sidebar-links h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--blue-deep);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid var(--blue-border);
            padding-bottom: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            color: var(--blue-dark);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .link-item:hover {
            background: var(--blue-light);
            border-color: var(--blue-primary);
            color: var(--blue-primary);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
        }

        .link-item i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Container chính của Chatbot bên phải */
        .chatbot { 
            flex-grow: 1;
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 32px;
            border: 1px solid rgba(186, 230, 253, 0.5);
        }

        /* Header */
        .header {
            border-bottom: 2px solid var(--blue-border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            color: var(--blue-dark); 
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header p.author { 
            color: #64748b; 
            font-size: 0.95rem; 
            font-weight: 500;
            margin-top: 4px;
        }
        .header p.counter { 
            color: var(--blue-primary); 
            font-size: 0.9rem; 
            margin-top: 6px;
            font-weight: 600;
        }

        /* Input/Search */
        #search-box {
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            padding: 14px 20px;
            width: 100%; 
            font-size: 1rem; 
            transition: all 0.25s ease;
            background-color: #f8fafc;
        }
        #search-box:focus { 
            border-color: var(--blue-primary); 
            background-color: #ffffff;
            outline: none; 
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        #search-button {
            background-color: var(--blue-primary); 
            color: #fff; 
            padding: 14px 24px;
            border-radius: 12px; 
            font-weight: 600;
            transition: all 0.25s ease; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        #search-button:hover { 
            background-color: var(--blue-dark); 
            transform: translateY(-1px);
        }

        /* Results */
        .result-item {
            border-left: 5px solid var(--blue-primary); 
            background: var(--blue-light); 
            padding: 18px 20px; 
            border-radius: 10px; 
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border-top: 1px solid rgba(186, 230, 253, 0.3);
            border-right: 1px solid rgba(186, 230, 253, 0.3);
            border-bottom: 1px solid rgba(186, 230, 253, 0.3);
        }
        .result-item p:first-of-type { 
            font-weight: 700; 
            color: var(--blue-deep); 
            font-size: 1.05rem;
            margin-bottom: 6px; 
        }
        .result-item p:nth-of-type(2) { 
            color: #1e293b; 
            margin-bottom: 8px; 
            line-height: 1.5;
            font-size: 0.98rem; 
        }

        /* Tabs */
        .tab-button {
            padding: 12px 20px; 
            border-bottom: 3px solid transparent;
            font-weight: 600; 
            color: #64748b; 
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px 8px 0 0;
        }
        .tab-button:hover {
            color: var(--blue-primary);
            background-color: rgba(224, 242, 254, 0.5);
        }
        .tab-button.active { 
            border-bottom-color: var(--blue-primary); 
            color: var(--blue-primary); 
            background-color: var(--blue-light);
        }

        /* Modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 20000; 
            left: 0; 
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(4px);
            padding-top: 40px;
        }
        .modal-content {
            background-color: #ffffff; 
            margin: auto; 
            padding: 28px;
            border-radius: 16px; 
            width: 92%; 
            max-width: 760px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
            position: relative;
            border: 1px solid var(--blue-border);
        }
        .close-button {
            color: #94a3b8; 
            float: right; 
            font-size: 28px;
            font-weight: bold; 
            line-height: 1; 
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-button:hover { color: var(--blue-deep); }

        /* QA List Items */
        .qa-item {
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            margin-bottom: 14px;
            padding: 16px; 
            cursor: pointer; 
            transition: all 0.2s;
            background: #ffffff;
        }
        .qa-item:hover { 
            background: var(--blue-light); 
            border-color: var(--blue-border);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08); 
        }
        .question { font-weight: 700; color: var(--blue-dark); font-size: 1rem; }
        .answer {
            margin-top: 12px; 
            padding: 12px 16px; 
            border-left: 4px solid var(--blue-primary);
            background: #f8fafc; 
            border-radius: 0 8px 8px 0;
            display: none;
            line-height: 1.5;
        }
        
        /* Quiz Styling */
        .quiz-option {
            border: 1.5px solid #cbd5e1; 
            padding: 12px 18px; 
            margin-bottom: 10px;
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.2s;
            background-color: #ffffff;
            font-weight: 500;
        }
        .quiz-option:hover { 
            background-color: var(--blue-light); 
            border-color: var(--blue-primary); 
        }
        .quiz-option.correct {
            background-color: #dcfce7 !important; 
            color: #15803d !important;
            border-color: var(--green-correct) !important; 
            font-weight: 700;
        }
        .quiz-option.incorrect {
            background-color: #fee2e2 !important; 
            color: #b91c1c !important;
            border-color: var(--red-incorrect) !important; 
            font-weight: 700;
        }
        .quiz-option.show-correct { 
            border: 2px solid var(--green-correct) !important; 
            background-color: #f0fdf4 !important;
        }
        .explanation {
            display: none; 
            margin-top: 16px; 
            padding: 14px; 
            font-size: 0.95rem;
            border-left-width: 4px;
            border-radius: 0 8px 8px 0;
        }
        .quiz-selection-btn, .footer-button {
            background-color: var(--blue-primary); 
            color: #fff; 
            padding: 12px 22px; 
            border-radius: 10px; 
            font-size: 1rem; 
            font-weight: 700; 
            text-align: center;
            transition: all 0.25s; 
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
        }
        .quiz-selection-btn:hover, .footer-button:hover { 
            background-color: var(--blue-dark); 
            transform: translateY(-1px);
        }

        /* Responsive cho màn hình nhỏ */
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar-links {
                width: 100%;
            }
        }
    </style>
</head>
<body onload="document.getElementById('search-box').focus()">

    <!-- Canvas hiệu ứng tuyết rơi -->
    <canvas id="snowflake-canvas"></canvas>

    <div class="main-layout">
        <!-- Cột Sidebar bên trái: Liên kết nhanh -->
        <div class="sidebar-links">
            <h3><i class="fas fa-link text-sky-600"></i> Liên kết nhanh</h3>
            
            <a href="https://www.youtube.com/watch?v=MN99xct3HQw&list=RDMMMN99xct3HQw&start_radio=1" target="_blank" class="link-item">
                <i class="fab fa-youtube text-red-600"></i>
                <span>Nhạc thư giãn / YouTube</span>
            </a>

            <a href="https://binhyen.thainguyen.gov.vn/" target="_blank" class="link-item">
                <i class="fas fa-folder-open text-sky-600"></i>
                <span>Trang thông tin điện tử xã Bình Yên</span>
            </a>

            <a href="https://www.facebook.com/profile.php?id=61577397223902&locale=vi_VN" target="_blank" class="link-item">
                <i class="fas fa-shield-alt text-amber-600"></i>
                <span>Facebook_Truyền thông xã Bình Yên</span>
            </a>
        </div>

        <!-- Cột bên phải: Giao diện Chatbot chính -->
        <div class="chatbot">
            <div class="header">
                <h1 class="flex items-center">
                    <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-400 via-blue-600 to-indigo-700 text-2xl shadow-[0_10px_20px_rgba(2,132,199,0.4)] mr-3 transform transition hover:scale-105">
                        🤖
                    </span>
                    Chatbot_Chính sách xã hội</h1>
                <p class="author">Bản quyền © 2026 bởi Phạm Hồng Long & AI Assistant</p>
                <p class="counter" id="total-qa-count"></p>
            </div>

            <div class="flex border-b border-sky-200 mb-6 space-x-2">
                <button class="tab-button active" id="tab-search" onclick="showTab('search')">
                    <i class="fas fa-comments"></i> Hỏi đáp AI
                </button>
                <button class="tab-button" id="tab-quick-learn" onclick="openQuickLearnModal()">
                    <i class="fas fa-book-open"></i> Học Nhanh (QA)
                </button>
                <button class="tab-button" id="tab-quiz" onclick="openQuizSelectionModal()">
                    <i class="fas fa-pencil-alt"></i> Thi Trắc nghiệm
                </button>
            </div>

            <div id="search-content">
                <div class="flex space-x-3 mb-6">
                    <input type="text" id="search-box" placeholder="Nhập câu hỏi về chính sách xã hội, y tế, người có công, quân đội... (Ví dụ: Nghị định 192, phụ cấp trực, trợ cấp ưu đãi)" class="flex-grow" onkeypress="handleKeyPress(event)">
                    <button id="search-button" onclick="handleUserQuery()">
                        <i class="fas fa-paper-plane mr-1"></i> Gửi
                    </button>
                </div>
                <div id="results-container" class="space-y-4">
                    <p class="text-slate-500 italic"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal dùng chung -->
    <div id="main-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" class="text-2xl font-bold mb-4 border-b pb-3 text-sky-800"></h2>
            <div id="modal-body" class="max-h-[68vh] overflow-y-auto pr-2"></div>
            <div id="modal-footer" class="mt-5 pt-3 border-t border-slate-100 flex justify-end items-center"></div>
        </div>
    </div>

    <script>
        // ====================================================================
        // I. CƠ SỞ DỮ LIỆU CÂU HỎI & ĐÁP ÁN (CHÍNH SÁCH XÃ HỘI)
        // ====================================================================
        const qaData = [
          {
            "q": "Nghị định số 192/2026/NĐ-CP quy định về những chế độ phụ cấp đặc thù nào trong lĩnh vực y tế?",
            "a": "Nghị định số 192/2026/NĐ-CP quy định các chế độ phụ cấp đặc thù trong lĩnh vực y tế bao gồm: phụ cấp trực, phụ cấp phẫu thuật, thủ thuật và phụ cấp chống dịch; đồng thời quy định mức hỗ trợ hằng tháng đối với nhân viên y tế thôn, tổ dân phố và cô đỡ thôn, bản.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương I, Điều 1, Khoản 1 & Khoản 2, trang 1"]

          {

            "a": "Đối tượng áp dụng gồm viên chức, người lao động làm việc tại các cơ sở y tế công lập, trạm y tế xã/phường/đặc khu, trung tâm giám định pháp y, tâm thần; sĩ quan, quân nhân chuyên nghiệp, công chức, viên chức y tế thuộc Bộ Quốc phòng, Bộ Công an; thành viên Ban Chỉ đạo phòng thủ dân sự các cấp; nhân viên y tế thôn/tổ dân phố và cô đỡ thôn/bản.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương I, Điều 2, Khoản 1, 2, 3, 4, 5, trang 1-2"]
          },
          {
            "q": "Mức phụ cấp trực 24/24 giờ vào ngày làm việc đối với người lao động tại cơ sở y tế hạng đặc biệt và hạng I được quy định là bao nhiêu?",
            "a": "Mức phụ cấp trực 24/24 giờ vào ngày làm việc đối với người lao động làm việc tại cơ sở y tế hạng đặc biệt, hạng I; Viện Pháp y Tâm thần Trung ương, Viện Pháp y Tâm thần Trung ương Biên Hòa là 325.000 đồng/người/phiên trực.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 3, Khoản 3, Điểm a, trang 5"]
          },
          {
            "q": "Mức phụ cấp trực 24/24 giờ vào ngày làm việc tại các cơ sở y tế hạng II và trung tâm giám định pháp y tâm thần khu vực là bao nhiêu?",
            "a": "Mức phụ cấp trực 24/24 giờ vào ngày làm việc tại các cơ sở y tế hạng II, trung tâm pháp y tâm thần khu vực, Viện Pháp y quân đội, Trung tâm Điều phối Quốc gia về Ghép bộ phận cơ thể người là 255.000 đồng/người/phiên trực.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 3, Khoản 3, Điểm a, trang 5"]
          },
          {
            "q": "Trực 24/24 giờ tại khu vực đặc biệt (cấp cứu, hồi sức tích cực, chống độc, đột quỵ...) được tính hệ số phụ cấp như thế nào?",
            "a": "Nếu trực 24/24 giờ tại khoa, khu vực đặc biệt quy định tại Điểm b Khoản 1 Điều 3 thì mức phụ cấp trực được tính bằng 1,5 lần mức quy định chung.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 3, Khoản 3, Điểm a, trang 5"]
          },
          {
            "q": "Mức phụ cấp trực 24/24 giờ vào ngày nghỉ hằng tuần, ngày lễ, Tết được tính bằng bao nhiêu lần mức quy định ngày làm việc?",
            "a": "Nếu trực 24/24 giờ vào ngày nghỉ hằng tuần thì mức phụ cấp trực tính bằng 1,3 lần mức quy định; trực vào ngày lễ, ngày Tết tính bằng 1,8 lần mức quy định.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 3, Khoản 3, Điểm a, trang 5"]

          {
            "q": "Mức hỗ trợ tiền ăn đối với người lao động tham gia trực 24/24 giờ là bao nhiêu?",

          {

            "a": "Mức phụ cấp phẫu thuật loại đặc biệt đối với người mổ chính, người gây mê hồi sức chính hoặc châm tê chính là 560.000 đồng/người/phẫu thuật.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 4, Khoản 1 (Bảng mức phụ cấp), trang 7"]

          {

            "a": "Mức phụ cấp chống dịch bệnh truyền nhiễm thuộc nhóm A đối với Nhóm 1 (người trực tiếp giám sát, điều tra, xét nghiệm, điều trị...) vào ngày thường là 420.000 đồng/ngày/người.",
            "sources": ["192-ndcp.signed.pdf (Nghị định số 192/2026/NĐ-CP ngày 30/05/2026)", "Chương II, Điều 5, Khoản 1, Điểm b, trang 8"]
          },
          {

            "correct_answer": "A. Rà soát, xác minh thông tin báo chí phản ánh về trường học vận động hỗ trợ gạo và điều kiện học tập cho học sinh",
            "explanation": "Công điện 62/CĐ-TTg chỉ đạo Chủ tịch UBND tỉnh Điện Biên khẩn trương rà soát, xác minh thông tin báo chí phản ánh trường học kêu gọi hỗ trợ gạo và điều kiện thiết yếu cho học sinh, bảo đảm các em có đủ điều kiện đến trường.",
            "source": "62_cd-ttg_31082026-signed.signed.pdf",
            "reference": "Mục 1, trang 1"
          },
          {
            "q": "Theo Nghị quyết số 37/2026/QH16, trường hợp nào sau đây được LOẠI TRỪ trách nhiệm hình sự trong ứng dụng khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số?",
            "options": [
              "A. Người gây thiệt hại do gặp rủi ro mặc dù đã tuân thủ đúng quy trình, quy định, áp dụng đầy đủ biện pháp phòng ngừa",
              "B. Người cố ý làm trái quy định nhưng mang lại lợi ích kinh tế cho địa phương",
              "C. Người có hành vi tham nhũng nhưng đã khắc phục toàn bộ hậu quả thiệt hại",
              "D. Người vi phạm pháp luật quy định tại Bộ luật Hình sự nhưng không nhận hối lộ"
            ],
            "correct_answer": "A. Người gây thiệt hại do gặp rủi ro mặc dù đã tuân thủ đúng quy trình, quy định, áp dụng đầy đủ biện pháp phòng ngừa",
            "explanation": "Nghị quyết 37/2026/QH16 quy định loại trừ trách nhiệm hình sự đối với người gây thiệt hại do gặp rủi ro trong ứng dụng KHCN, đổi mới sáng tạo, chuyển đổi số mặc dù đã tuân thủ đúng quy trình, quy định và áp dụng đầy đủ các biện pháp phòng ngừa.",
            "source": "nq37_nqcochedacthuxlvppl.signed.pdf",
            "reference": "Chương II, Điều 6, Khoản 1, trang 4"
          },
          {
            "q": "Theo Nghị quyết số 37/2026/QH16, thời hạn tạm đình chỉ giải quyết tố giác, tin báo về tội phạm, kiến nghị khởi tố, điều tra tối đa là bao lâu?",
            "options": [
              "A. Không quá 06 tháng",
              "B. Tối đa là 01 năm",
              "C. Tối đa là 02 năm kể từ thời điểm ban hành quyết định",
              "D. Tối đa là 03 năm kể từ ngày Nghị quyết có hiệu lực"
            ],
            "correct_answer": "C. Tối đa là 02 năm kể từ thời điểm ban hành quyết định",
            "explanation": "Thời hạn tạm đình chỉ giải quyết tố giác, tin báo về tội phạm, kiến nghị khởi tố, điều tra, truy tố, xét xử đối với các trường hợp đủ điều kiện quy định tại Nghị quyết tối đa là 02 năm kể từ thời điểm ban hành quyết định.",
            "source": "nq37_nqcochedacthuxlvppl.signed.pdf",
            "reference": "Chương II, Điều 9, Khoản 3, trang 5"
          }
        ];

        let allQuizzes = [];
        const quizTopics = [
            "Đề 1: Phụ cấp y tế & Chính sách người có uy tín", 
            "Đề 2: Giáo dục nghề nghiệp & Trợ cấp ưu đãi người có công", 
            "Đề 3: Chế độ Quân đội & Cán bộ, công chức cấp xã", 
            "Đề 4: Tổng hợp Văn bản hợp nhất Bộ Quốc phòng & QLNN", 
            "Đề 5: Cơ chế đặc thù & Công điện chỉ đạo"
        ];

        let currentQuestionIndex = 0;
        let userAnswers = [];
        let currentQuizQuestions = [];
        let currentQuizTopicIndex = 0;
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-qa-count').innerHTML = `Hệ thống hỗ trợ tra cứu chuẩn xác với <b>${qaData.length} câu hỏi & đáp án</b> về Chính sách xã hội.`;
            document.querySelector('#results-container p').innerHTML = `Kết quả tra cứu sẽ hiển thị tại đây. Cơ sở dữ liệu chứa <b>${qaData.length} câu hỏi</b> chi tiết.`;
            generateQuizzes();
        });
        
        function generateQuizzes() {
            allQuizzes = quizTopics.map(() => shuffleArray([...quizRawData]).slice(0, 10));
        }

        function showTab(tabId) {
            ['search', 'quick-learn', 'quiz'].forEach(id => document.getElementById(`tab-${id}`).classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (tabId === 'search') document.getElementById('search-box').focus();
        }
        
        function handleKeyPress(event) { if (event.key === 'Enter') handleUserQuery(); }

        function handleUserQuery() {
            const searchBox = document.getElementById('search-box');
            const query = searchBox.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('results-container');
            
            if (query.length < 2) {
                resultsContainer.innerHTML = '<p class="text-red-500 font-semibold">Vui lòng nhập từ khóa tìm kiếm chi tiết hơn (tối thiểu 2 ký tự).</p>';
                return;
            }
            
            const searchResults = qaData.filter(item => item.q.toLowerCase().includes(query) || item.a.toLowerCase().includes(query));
            
            if (searchResults.length > 0) {
                resultsContainer.innerHTML = `<p class="text-sky-800 font-semibold italic mb-3">Tìm thấy ${searchResults.length} kết quả phù hợp:</p>`;
                searchResults.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'result-item';
                    el.innerHTML = `
                        <p><i class="fas fa-question-circle text-sky-600 mr-2"></i>${item.q}</p>
                        <p>${item.a}</p>
                        <p class="text-xs text-slate-500 font-medium">📌 Nguồn trích dẫn: ${item.sources.join(', ')}</p>`;
                    resultsContainer.appendChild(el);
                });
            } else {
                resultsContainer.innerHTML = `<p class="text-slate-500 font-semibold italic">❌ Không tìm thấy thông tin phù hợp với từ khóa "${query}".</p>`;
            }
        }
        
        function openQuickLearnModal() {
            showTab('quick-learn');
            const modal = document.getElementById('main-modal');
            modal.querySelector('#modal-title').innerHTML = `<i class="fas fa-book-reader mr-2"></i>HỌC NHANH: ${qaData.length} CÂU HỎI & ĐÁP ÁN CHÍNH SÁCH XÃ HỘI`;
            const modalBody = modal.querySelector('#modal-body');
            modalBody.innerHTML = '';
            modal.querySelector('#modal-footer').innerHTML = ''; 
            
            qaData.forEach((item, index) => {
                const qaItem = document.createElement('div');
                qaItem.className = 'qa-item';
                qaItem.onclick = () => {
                    const ans = qaItem.querySelector('.answer');
                    ans.style.display = ans.style.display === 'block' ? 'none' : 'block';
                };
                qaItem.innerHTML = `
                    <div class="question"><span class="text-sky-600 mr-2">Câu ${index + 1}:</span> ${item.q}</div>
                    <div class="answer">
                        <span class="font-bold text-sky-700">ĐÁP ÁN:</span> ${item.a}
                        <p class="text-xs text-slate-500 mt-2 font-medium">📌 Nguồn: ${item.sources.join(', ')}</p>
                    </div>`;
                modalBody.appendChild(qaItem);
            });
            modal.style.display = 'block';
        }

        function openQuizSelectionModal() {
            showTab('quiz');
            const modal = document.getElementById('main-modal');
            modal.querySelector('#modal-title').innerHTML = '<i class="fas fa-tasks mr-2"></i>THI TRẮC NGHIỆM: CHỌN ĐỀ THI';
            const modalBody = modal.querySelector('#modal-body');
            let html = `<p class="mb-4 font-semibold text-slate-700">Vui lòng chọn 1 trong các bộ đề ôn luyện dưới đây (mỗi đề gồm 10 câu):</p><div class="flex flex-col space-y-3">`;
            quizTopics.forEach((topic, i) => { 
                html += `<button class="quiz-selection-btn flex justify-between items-center" onclick="startQuiz(${i})">
                            <span><i class="fas fa-file-alt mr-2"></i>${topic}</span>
                            <i class="fas fa-chevron-right text-sm"></i>
                         </button>`; 
            });
            html += `</div>`;
            modalBody.innerHTML = html;
            modal.querySelector('#modal-footer').innerHTML = '';
            modal.style.display = 'block';
        }

        function startQuiz(quizIndex) {
            currentQuestionIndex = 0;
            currentQuizTopicIndex = quizIndex;
            currentQuizQuestions = allQuizzes[quizIndex];
            userAnswers = new Array(currentQuizQuestions.length).fill(null);
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const q = currentQuizQuestions[currentQuestionIndex];
            const modal = document.getElementById('main-modal');
            modal.querySelector('#modal-title').innerHTML = `<i class="fas fa-edit mr-2"></i>${quizTopics[currentQuizTopicIndex]} <span class="text-sm font-normal text-sky-600 block sm:inline sm:ml-2">(Câu ${currentQuestionIndex + 1}/${currentQuizQuestions.length})</span>`;
            const modalBody = modal.querySelector('#modal-body');

            let optionsHtml = q.options.map(opt => `<div class="quiz-option" data-answer="${opt}" onclick="selectQuizOption(this)">${opt}</div>`).join('');

            modalBody.innerHTML = `
                <div class="mb-5">
                    <p class="text-lg font-bold text-sky-900 leading-snug">${q.q}</p>
                </div>
                <div id="quiz-options-container" class="space-y-2">${optionsHtml}</div>
                <div id="quiz-feedback" class="explanation"></div>`;
            
            modal.querySelector('#modal-footer').innerHTML = `
                <button id="next-quiz-btn" class="footer-button" onclick="navigateQuiz()">
                    ${currentQuestionIndex === currentQuizQuestions.length - 1 ? 'Nộp bài <i class="fas fa-check-circle ml-1"></i>' : 'Câu tiếp theo <i class="fas fa-arrow-right ml-1"></i>'}
                </button>`;
        }

        function selectQuizOption(selectedEl) {
            const optionsContainer = document.getElementById('quiz-options-container');
            if (optionsContainer.dataset.answered) return;
            optionsContainer.dataset.answered = 'true';

            const questionData = currentQuizQuestions[currentQuestionIndex];
            const userAnswer = selectedEl.getAttribute('data-answer');
            const isCorrect = userAnswer === questionData.correct_answer;
            
            userAnswers[currentQuestionIndex] = { userAnswer, isCorrect };

            selectedEl.classList.add(isCorrect ? 'correct' : 'incorrect');

            if (!isCorrect) {
                const correctOption = optionsContainer.querySelector(`[data-answer="${questionData.correct_answer}"]`);
                if(correctOption) correctOption.classList.add('show-correct');
            }
            
            const feedbackDiv = document.getElementById('quiz-feedback');
            feedbackDiv.style.background = isCorrect ? '#f0fdf4' : '#fef2f2';
            feedbackDiv.style.borderColor = isCorrect ? 'var(--green-correct)' : 'var(--red-incorrect)';
            feedbackDiv.style.color = isCorrect ? '#166534' : '#991b1b';
            feedbackDiv.innerHTML = `<b>${isCorrect ? '✓ Chính xác!' : '✗ Chưa chính xác!'}</b><p class="mt-1"><b>Giải thích / Nguồn:</b> ${questionData.explanation} (Nguồn: ${questionData.source}, ${questionData.reference})</p>`;
            feedbackDiv.style.display = 'block';
        }

        function navigateQuiz() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert('Vui lòng chọn một đáp án trước khi tiếp tục!');
                return;
            }
            if (currentQuestionIndex < currentQuizQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuizQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            const total = currentQuizQuestions.length;
            const correctCount = userAnswers.filter(a => a && a.isCorrect).length;
            const score = (correctCount / total) * 10;
            
            const modal = document.getElementById('main-modal');
            modal.querySelector('#modal-title').innerHTML = `<i class="fas fa-award mr-2 text-yellow-500"></i>KẾT QUẢ BÀI THI TRẮC NGHIỆM`;
            modal.querySelector('#modal-body').innerHTML = `
                <div class="text-center py-6 px-4">
                    <p class="text-xl font-semibold text-slate-700">Bạn đã trả lời đúng</p>
                    <p class="text-6xl font-extrabold text-sky-600 my-3">${correctCount} / ${total}</p>
                    <p class="text-2xl font-bold text-slate-800">Điểm số: <span class="text-sky-700">${score.toFixed(1)}</span> / 10</p>
                    <p class="text-sm text-slate-500 mt-3">${score >= 8 ? '🎉 Xuất sắc! Bạn nắm rất vững kiến thức Chính sách xã hội.' : score >= 5 ? '👍 Khá tốt! Hãy tiếp tục phát huy.' : '📖 Bạn nên ôn tập lại kiến thức nhé!'}</p>
                </div>`;
            modal.querySelector('#modal-footer').innerHTML = `
                <div class="w-full flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                    <button class="footer-button bg-slate-600 hover:bg-slate-700 flex-1" onclick="showReview()"><i class="fas fa-eye mr-1"></i> Xem lại bài làm</button>
                    <button class="footer-button bg-amber-600 hover:bg-amber-700 flex-1" onclick="startQuiz(currentQuizTopicIndex)"><i class="fas fa-redo mr-1"></i> Thi lại đề này</button>
                    <button class="footer-button flex-1" onclick="openQuizSelectionModal()"><i class="fas fa-list-ul mr-1"></i> Chọn đề khác</button>
                </div>`;
        }

        function showReview() {
            const modal = document.getElementById('main-modal');
            modal.querySelector('#modal-title').innerHTML = `<i class="fas fa-search-plus mr-2"></i>CHI TIẾT BÀI LÀM`;
            const modalBody = modal.querySelector('#modal-body');
            let reviewHtml = '';

            currentQuizQuestions.forEach((q, index) => {
                const userAnswer = userAnswers[index] || { userAnswer: "Chưa trả lời", isCorrect: false };
                const statusColor = userAnswer.isCorrect ? 'var(--green-correct)' : 'var(--red-incorrect)';
                reviewHtml += `
                    <div class="p-4 border rounded-xl mb-3 bg-white shadow-sm" style="border-left: 5px solid ${statusColor};">
                        <p class="font-bold text-sky-900 mb-2">Câu ${index + 1}: ${q.q}</p>
                        <p class="text-sm">- Lựa chọn của bạn: <span class="font-semibold" style="color: ${statusColor};">${userAnswer.userAnswer}</span> ${userAnswer.isCorrect ? '✔️' : '❌'}</p>
                        ${!userAnswer.isCorrect ? `<p class="text-sm mt-1">- Đáp án đúng: <span class="font-semibold text-green-700">${q.correct_answer}</span></p>` : ''}
                        <div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200"><p><b>Ghi chú:</b> ${q.explanation} (Nguồn: ${q.source})</p></div>
                    </div>`;
            });
            modalBody.innerHTML = reviewHtml;
            modal.querySelector('#modal-footer').innerHTML = `<button class="footer-button" onclick="submitQuiz()"><i class="fas fa-undo mr-1"></i> Quay lại điểm số</button>`;
        }
        
        // --- SCRIPT HIỆU ỨNG TUYẾT RƠI ---
        (function() {
            const canvas = document.getElementById('snowflake-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const flakes = Array.from({ length: 60 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 3.5 + 1.2,
                d: Math.random() * 1 + 0.5,
                a: Math.random() * 360,
                opacity: Math.random() * 0.7 + 0.3
            }));

            function draw() {
                ctx.clearRect(0, 0, width, height);
                flakes.forEach(f => {
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, false);
                    ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                    ctx.fill();

                    f.y += f.d;
                    f.a += 0.02;
                    f.x += Math.sin(f.a) * 0.8;

                    if (f.y > height) {
                        f.y = -10;
                        f.x = Math.random() * width;
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // --- HÀM HỖ TRỢ & ĐÓNG MODAL---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function closeModal() {
            document.getElementById('main-modal').style.display = 'none';
            showTab('search'); 
        }
    </script>
